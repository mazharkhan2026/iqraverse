  /progress/{variantId}:
    get:
      parameters:
      - in: path
        name: variantId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: mode
        required: false
        schema:
          enum:
          - practice
          - mock
          - course
          - all
          type: string
      - name: syllabusVersionId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Omit for active edition; explicit value must belong to selected variant and be authorized.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: GET /progress/{variantId}
      description: Simple accuracy on latest eligible graded answer per distinct logical question in the selected
        edition and topic. Fewer than 3 distinct answered = insufficient; below 60% with adequate sample = weak.
        Unanswered excluded. Mode all means all independent practice/mock only; course results explicit.
  /attempts/{attemptId}/integrity-events:
    post:
      summary: Report secure mock screen-away excursion
      description: Owner and bound session only. Secure mocks only; practice rejected. Server checks deadline and
        locks attempt, deduplicates eventId, counts one accepted report, finalizes saved answers at threshold. Retry
        accepted event returns current state without increment. New event after finalization returns 409. Events
        are advisory and not proof of cheating. Session mismatch 403; no client-controlled penalty.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityEvent'
      responses:
        '200':
          description: Current integrity and attempt state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityEventResult'
        '400':
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Wrong session or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Attempt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Inactive attempt or policy conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
