      - name: syllabusVersionId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Omit for active edition; explicit value must belong to selected variant and be authorized.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Subject'
